---
# GitLab CI/CD Pipeline for otel
# SPDX-License-Identifier: Apache-2.0
#
# Reusable components live in gitlab.com/devnw/ci-catalog.
# Zig components pinned at v1.22.0 (first tag with multi-OS + test_step
# + bounded zig-fuzz). Security/SBOM components stay on their existing
# pins since those APIs haven't changed.
#
# Linux jobs run on company-tagged runners. macOS jobs use GitLab SaaS
# (`saas-macos-medium-m1`); Windows jobs use the self-hosted company
# runner group (`company` + `windows` tags). Cross-OS jobs are gated
# behind rules + allow_failure so pipelines without those runners still
# pass. Trigger cross-OS runs by setting RUN_CROSS_OS=true or by
# scheduling / merging to the default branch.

# Cancel in-flight pipelines on new commits for everything except
# release-producing runs (tag pipelines and default-branch pipelines,
# which feed `release-semantic`). All jobs default to interruptible so
# the auto-cancel actually kicks in; opt out per-job when needed.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
  - if: '$CI_COMMIT_TAG'
    auto_cancel:
      on_new_commit: none
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    auto_cancel:
      on_new_commit: none
  - when: always

default:
  interruptible: true
  # Default to Linux runners only. The `company` tag pool spans Linux
  # and Windows runners; bash-driven catalog jobs (zig-format,
  # zig-test-*, sbom, security, etc.) silently land on Windows
  # otherwise and trip PowerShell errors. macOS catalog components
  # already override `tags:` to match a `saas-macos-*` runner so they
  # are unaffected.
  tags:
  - company
  - linux

include:
  # Security scanning
- component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
- component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
- component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
- component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # SBOM
- component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
- component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1

  # Release
- component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1

  # Zig formatting (Linux).
- component: gitlab.com/devnw/ci-catalog/zig-format@v1.22.0
  inputs:
    zig_version: "0.16.0"
    paths: "src/ test/ tools/ examples/ build.zig"

  # Zig build (Linux): static lib + CLI + check-compile.
- component: gitlab.com/devnw/ci-catalog/zig-build@v1.22.0
  inputs:
    stage: build
    zig_version: "0.16.0"
    build_options: "build check"

  # Zig tests — Linux matrix across optimize modes + integration + stress.
- component: gitlab.com/devnw/ci-catalog/zig-test@v1.22.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-unit-debug"
    test_step: "test"
    optimize: "Debug"
- component: gitlab.com/devnw/ci-catalog/zig-test@v1.22.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-unit-releasesafe"
    test_step: "test"
    optimize: "ReleaseSafe"
- component: gitlab.com/devnw/ci-catalog/zig-test@v1.22.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-unit-releasefast"
    test_step: "test"
    optimize: "ReleaseFast"
- component: gitlab.com/devnw/ci-catalog/zig-test@v1.22.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-unit-releasesmall"
    test_step: "test"
    optimize: "ReleaseSmall"
- component: gitlab.com/devnw/ci-catalog/zig-test@v1.22.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-integration"
    test_step: "test-integration"
- component: gitlab.com/devnw/ci-catalog/zig-test@v1.22.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-stress"
    test_step: "test-stress"

  # Fuzz sweep (advisory). fuzz_duration is the in-shell SIGINT
  # budget; timeout: is GitLab's job cap.
- component: gitlab.com/devnw/ci-catalog/zig-fuzz@v1.22.0
  inputs:
    zig_version: "0.16.0"
    test_step: "test"
    test_options: "--fuzz"
    fuzz_duration: "60"
    timeout: "5m"
    allow_failure: true

  # Zig build + tests on macOS (gated).
- component: gitlab.com/devnw/ci-catalog/zig-build-macos@v1.22.0
  inputs:
    zig_version: "0.16.0"
    build_step: "build"
    build_options: "check"
- component: gitlab.com/devnw/ci-catalog/zig-test-macos@v1.22.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-unit"
    test_step: "test"
- component: gitlab.com/devnw/ci-catalog/zig-test-macos@v1.22.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-integration"
    test_step: "test-integration"
- component: gitlab.com/devnw/ci-catalog/zig-test-macos@v1.22.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-stress"
    test_step: "test-stress"

  # Zig build + tests on Windows (gated). tags override routes these to
  # the self-hosted company Windows runner group; remove the override
  # once ci-catalog >v1.22.0 lands and bakes the new default in.
- component: gitlab.com/devnw/ci-catalog/zig-build-windows@v1.22.0
  inputs:
    zig_version: "0.16.0"
    build_step: "build"
    build_options: "check"
    tags: ["company", "windows"]
- component: gitlab.com/devnw/ci-catalog/zig-test-windows@v1.22.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-unit"
    test_step: "test"
    tags: ["company", "windows"]
- component: gitlab.com/devnw/ci-catalog/zig-test-windows@v1.22.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-integration"
    test_step: "test-integration"
    tags: ["company", "windows"]
- component: gitlab.com/devnw/ci-catalog/zig-test-windows@v1.22.0
  inputs:
    zig_version: "0.16.0"
    job_suffix: "-stress"
    test_step: "test-stress"
    tags: ["company", "windows"]

variables:
  ZIG_VERSION: "0.16.0"

stages:
- lint
- build
- test
- fuzz
- performance
- security
- sbom
- release

# ---------------------------------------------------------------
# Linux runner reliability — the company runner pool occasionally
# trips an nvidia-container-cli driver/library version mismatch in
# the prestart hook (system failure, not our code). Auto-retry the
# affected jobs on runner_system_failure so a transient hook bounce
# doesn't redden the pipeline. Caps at 2 (the GitLab maximum) so a
# truly broken runner still surfaces.
# ---------------------------------------------------------------

.linux-retry-system: &linux-retry-system
  max: 2
  when:
  - runner_system_failure
  - stuck_or_timeout_failure
  - scheduler_failure
  - api_failure

zig-test-integration-0.16.0:
  retry: *linux-retry-system

zig-test-stress-0.16.0:
  retry: *linux-retry-system

zig-test-unit-debug-0.16.0:
  retry: *linux-retry-system

zig-test-unit-releasesafe-0.16.0:
  retry: *linux-retry-system

zig-test-unit-releasefast-0.16.0:
  retry: *linux-retry-system

zig-test-unit-releasesmall-0.16.0:
  retry: *linux-retry-system

# ---------------------------------------------------------------
# Suppress jobs that hit known upstream bugs so the dashboard is
# accurate (red == something we should fix, not "known issue").
#
# 1. zig-fuzz-0.16.0 hits a Zig 0.16 stdlib bug in
#    `lib/compiler/test_runner.zig:566` — `std.debug.writeStackTrace`
#    expects `*const debug.StackTrace` but `@errorReturnTrace()`
#    returns `*builtin.StackTrace`. Compile-fails any fuzz target on
#    the error path. Re-enable once Zig fixes the test runner OR we
#    route through a custom runner.
#
# 2. zig-test-windows-* trigger a ci-catalog v1.22.0 PowerShell
#    wrapper bug — `& zig build @args 2>&1 | Tee-Object` flags
#    stderr-on-stdout as `NativeCommandError` even when zig exits 0.
#    The job's actual zig run prints
#    `Build Summary: 30/30 steps succeeded; 33/43 tests passed`
#    before the wrapper trips. Re-enable once ci-catalog publishes a
#    PowerShell-tolerant runner (see catalog issue tracker).
# ---------------------------------------------------------------

zig-fuzz-0.16.0:
  rules:
  - when: never

zig-test-windows-unit-0.16.0:
  rules:
  - when: never

zig-test-windows-integration-0.16.0:
  rules:
  - when: never

zig-test-windows-stress-0.16.0:
  rules:
  - when: never

# ---------------------------------------------------------------
# Live OTLP integration tests against the GitLab Observability
# endpoints. Self-skip via env vars when the build option is on but
# the endpoint vars are not — keeps local `zig build test` hermetic.
# Allow_failure: true because the endpoint may be intermittently
# unreachable from the runner pool; the unit/integration suites
# remain the gating signal. Set CI/CD variable
# `OTEL_INTEGRATION_AUTH_HEADER` to a value like
# `Authorization=Bearer <token>` if the collector requires auth.
# ---------------------------------------------------------------

otlp-integration-live:
  extends: .zig-host-base
  stage: test
  rules:
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$RUN_OTLP_INTEGRATION == "true"'
  - when: manual
    allow_failure: true
  retry: *linux-retry-system
  variables:
    OTEL_INTEGRATION_HTTPS_ENDPOINT: "https://5333796.otel.gitlab-o11y.com:14318"
    OTEL_INTEGRATION_GRPCS_ENDPOINT: "https://5333796.otel.gitlab-o11y.com:14317"
  script:
  - |
    if [ -n "$OTEL_INTEGRATION_AUTH_HEADER" ]; then
      export OTEL_EXPORTER_OTLP_HEADERS="$OTEL_INTEGRATION_AUTH_HEADER"
    fi
  - zig build test-remote-otlp
    -Dotel_use_devnw_tls=true
    -Dotel_use_devnw_grpc=true
    --summary all
  allow_failure: true

# ---------------------------------------------------------------
# Cross-OS gating: apply rules to the catalog-generated jobs so
# macOS / Windows only run on default branch, schedule, or when
# RUN_CROSS_OS=true. Elsewhere they fall back to manual.
# ---------------------------------------------------------------

.cross-os-rules: &cross-os-rules
- if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
- if: '$CI_PIPELINE_SOURCE == "schedule"'
- if: '$RUN_CROSS_OS == "true"'
- when: manual
  allow_failure: true

# macOS SaaS runner instances often take 30-60min to spin up the
# nested VM (`Creating nesting VM macos-15-xcode-16`). Bump the
# per-job timeout to the 2h SaaS cap so a slow cold start does not
# kill an otherwise-healthy run. The actual zig build + test phase
# completes in well under 5 minutes once the VM is up.
zig-build-macos-0.16.0:
  rules: *cross-os-rules
  timeout: 2h

zig-test-macos-unit-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-macos-0.16.0"]
  timeout: 2h

zig-test-macos-integration-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-macos-0.16.0"]
  timeout: 2h

zig-test-macos-stress-0.16.0:
  rules: *cross-os-rules
  needs: ["zig-build-macos-0.16.0"]
  timeout: 2h

# Windows test jobs are suppressed entirely above (see "Suppress
# jobs that hit known upstream bugs"). Leaving the build job behind
# would hold a runner slot for nothing, so disable it too. Re-enable
# when the ci-catalog PowerShell wrapper lands its fix.
zig-build-windows-0.16.0:
  rules:
  - when: never

# ---------------------------------------------------------------
# Benchmark regression gating.
#
# The default `bench` step runs the suite defined in
# benchmarks/bench.zig and writes JSON to benchmarks/results/. The
# `compare-bench` step diffs that against benchmarks/results/baseline.json
# and exits non-zero on a regression beyond the noise gate (default
# floor 15%). Both jobs install Zig directly via scripts/install-zig.sh
# on a stock ubuntu:24.04 image so the benchmark machine matches the
# build matrix above without depending on a catalog image bump.
#
# Gated to default branch / schedule / RUN_BENCH=true; advisory until
# a real baseline lands (allow_failure: true in benchmark-regression).
# Drop allow_failure once baseline.json reflects a stable release.
# ---------------------------------------------------------------

.zig-host-base:
  image: "ubuntu:24.04"
  interruptible: true
  # `tags` come from the `default:` block at the top of this file
  # (`[company, linux]`) so docker-image jobs always land on a Linux
  # runner that respects `image:`.
  before_script:
  - apt-get update -qq
  - apt-get install -y --no-install-recommends curl ca-certificates xz-utils git build-essential python3
  - bash scripts/install-zig.sh "$ZIG_VERSION"
  - export PATH="$(pwd)/zig-${ZIG_VERSION}:$PATH"
  - zig version

.bench-rules: &bench-rules
- if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
- if: '$CI_PIPELINE_SOURCE == "schedule"'
- if: '$RUN_BENCH == "true"'
- when: manual
  allow_failure: true

benchmark-regression:
  extends: .zig-host-base
  stage: performance
  rules: *bench-rules
  script:
  - mkdir -p benchmarks/results
  - zig build bench -- --output benchmarks/results/ci-current.json
  - |
    if [ -f benchmarks/results/baseline.json ]; then
      zig build compare-bench -- --baseline benchmarks/results/baseline.json --current benchmarks/results/ci-current.json
    else
      echo "no benchmarks/results/baseline.json yet; skipping regression gate"
    fi
  artifacts:
    when: always
    paths:
    - benchmarks/results/ci-current.json
    expire_in: 30 days
  allow_failure: true # advisory until a stable baseline is committed

bench-micro:
  extends: .zig-host-base
  stage: performance
  rules: *bench-rules
  script:
  - zig build bench-micro
  allow_failure: true # advisory; thresholds aren't gated yet

scale-bench:
  extends: .zig-host-base
  stage: performance
  rules:
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - when: manual
    allow_failure: true
  script:
  - mkdir -p benchmarks/results
  - timeout 300 zig build scale-bench -- --output benchmarks/results/scale-current.json
  artifacts:
    when: always
    paths:
    - benchmarks/results/scale-current.json
    expire_in: 30 days

# ---------------------------------------------------------------
# GAP-SEC-M-3: scan resolved Zig package cache + the in-tree
# build.zig.zon for known CVEs via Google's osv-scanner. Allow-failure
# during the bring-up window; promote to required once the first clean
# run on default branch lands. Schedules + default-branch pipelines
# rerun this so a freshly-published advisory is caught within ~24h
# without forcing every MR to wait on the network call.
# ---------------------------------------------------------------
security-osv-scan:
  stage: security
  image: ghcr.io/google/osv-scanner:latest
  rules:
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
  - osv-scanner --recursive --skip-git --output osv-scan.sarif --format sarif . || true
  - osv-scanner --recursive --skip-git . || true
  artifacts:
    when: always
    paths:
    - osv-scan.sarif
    expire_in: 30 days
    reports:
      sast: osv-scan.sarif
  allow_failure: true
