# Pre-commit configuration
# https://pre-commit.com/

default_stages: [pre-commit]
fail_fast: false

repos:
  # Standard pre-commit hooks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
    # NEW-H-1: vendored upstream sources under `third_party/` MUST stay
    # byte-for-byte identical to upstream so the SHA-256 manifest in
    # `docs/{proto,semconv}-manifest.txt` anchors actual upstream
    # content; auto-fixing whitespace would silently break the gate.
    exclude: ^(\.gitlab/|third_party/)
  - id: end-of-file-fixer
    exclude: ^(\.gitlab/|third_party/)
  - id: mixed-line-ending
    args: [--fix=lf]
    exclude: ^third_party/
  - id: check-yaml
    args: [--unsafe]
  - id: check-json
  - id: check-toml
  - id: check-xml
  - id: check-added-large-files
    args: [--maxkb=1024]
    # The semconv `model/` tree contains a few YAML files >100 KB; the
    # whole vendored tree is well under the repo-policy MB threshold,
    # so the per-file size check is excluded for that subtree.
    exclude: ^third_party/semantic-conventions-v1\.40\.0/model/
  - id: check-merge-conflict
  - id: check-executables-have-shebangs
  - id: check-shebang-scripts-are-executable
  - id: detect-private-key

  # Shell linting
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.10.0.1
  hooks:
  - id: shellcheck
    args: [--severity=error]

  # Markdown linting
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.43.0
  hooks:
  - id: markdownlint
    args: [--config, .markdownlint.json]
    # CHANGELOG style is intentionally non-conformant; vendored
    # `third_party/` markdown is upstream-owned (see NEW-H-1 note above).
    exclude: ^(CHANGELOG\.md$|third_party/)

  # YAML formatting
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.14.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    exclude: ^(\.gitlab-ci\.yml$|third_party/)

  # Conventional commits
- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.1.0
  hooks:
  - id: commitizen
    stages: [commit-msg]

  # Local Zig hooks — pin to the project's zig version via mise so local
  # zig-build and zig-fmt do not drift when the host's default zig differs.
- repo: local
  hooks:
  - id: zig-fmt
    name: zig fmt (check)
    entry: mise x zig@0.16.0 -- zig fmt --check
    language: system
    files: \.zig$
    pass_filenames: false
    args: [src/, test/, examples/, benchmarks/, tools/, build.zig]

  - id: zig-build
    name: zig build (check)
    entry: mise x zig@0.16.0 -- zig build check
    language: system
    pass_filenames: false
    files: \.zig$

  - id: zig-test
    name: zig test
    entry: mise x zig@0.16.0 -- zig build test
    language: system
    pass_filenames: false
    files: \.zig$
    stages: [pre-push]

  - id: check-todos
    name: check TODOs
    entry: >
      bash -c 'if grep -rn "TODO\|FIXME\|HACK\|XXX" src/ test/
      --include="*.zig" 2>/dev/null; then echo "Warning: Found
      TODO/FIXME markers"; fi; exit 0'
    language: system
    pass_filenames: false
    verbose: true

ci:
  autofix_prs: true
  autofix_commit_msg: '[pre-commit.ci] auto fixes'
  autoupdate_schedule: weekly
  skip: [zig-fmt, zig-build, zig-test]
